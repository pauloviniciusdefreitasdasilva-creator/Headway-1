<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1120">
<title>Headway 1 · Complete Elementary Course</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1120;color:#edf2ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 0%,#29234e 0,transparent 55%),radial-gradient(ellipse at 100% 100%,#103a37 0,transparent 45%),#0b1120}
main{width:min(100%,620px);padding:clamp(24px,5vw,44px);border:1px solid #34415d;border-radius:24px;background:#141d2e;box-shadow:0 25px 80px #0006}
.kicker{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#a9a0ff}
h1{font-size:clamp(32px,7vw,54px);letter-spacing:-.06em;line-height:1;margin:12px 0;color:#fff}
p{color:#bdc9de;line-height:1.6;font-size:14px}
.track{height:8px;background:#293650;border-radius:20px;overflow:hidden;margin:24px 0 10px}
.track span{display:block;height:100%;width:15%;background:linear-gradient(90deg,#8e82ff,#5edbc4);border-radius:20px;animation:load 1.5s ease-in-out infinite alternate}
@keyframes load{to{width:90%}}
small{font-size:11px;color:#94a3bb}
#error{color:#ffc0cc;background:#3b202c;border:1px solid #764053;padding:12px;border-radius:12px;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<div class="kicker">JOÃO · ENGLISH STUDIO · A1–A2</div>
<h1>HEADWAY 1</h1>
<p>Carregando as 12 unidades do curso completo. O conteúdo está sendo preparado para leitura neste navegador.</p>
<div class="track"><span></span></div>
<small id="status">Abrindo o curso…</small>
<div id="error" hidden></div>
</main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const error=document.getElementById('error');
  try{
    if(!('DecompressionStream' in window)) throw new Error('Este navegador não oferece suporte à descompressão necessária. Atualize o Chrome, Edge, Firefox ou Safari.');
    const response=await fetch('./course.html.gz',{cache:'no-store'});
    if(!response.ok) throw new Error('Não foi possível carregar o arquivo do curso (HTTP '+response.status+').');
    const stream=response.body.pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('Headway 1')||!html.includes('unitsRoot')) throw new Error('O arquivo do curso foi carregado, mas não passou pela verificação de conteúdo.');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    status.hidden=true;
    error.hidden=false;
    error.textContent='Não foi possível abrir o curso.\n\n'+(err?.message||String(err))+'\n\nAtualize a página ou confira se course.html.gz está na raiz do repositório.';
  }
})();
</script>
</body>
</html>
